# Alfredo Caja para Windows (F9 T9.10) y Mac (F10 T10.9): tests de Rust, build del instalador NSIS
# en windows-latest y del binario universal + DMG en macos-latest, firma del updater de Tauri,
# firma Authenticode (si hay certificado), Developer ID y notarización de Apple (si están los
# secretos) y release.
#
# - pull_request / push a main con cambios en apps/desktop: cargo test + build (artefacto).
# - etiqueta desktop-vX.Y.Z (o workflow_dispatch con `publicar`): además crea la release de
#   GitHub (prerelease = canal beta) y registra la versión INACTIVA en
#   POST /api/control/desktop-releases. Se activa a mano tras la QA (T9.12).
#
# El mismo archivo corre en el espejo público Pbezama/alfredo-caja-escritorio (tools/release/
# desktop-espejo.sh), con DESKTOP_DIR=. — el repo privado no tiene minutos de Actions mientras
# la facturación de GitHub esté detenida (16-10-2026).
#
# Secretos:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  firma del updater (obligatoria para publicar)
#   DESKTOP_PUBLISH_TOKEN                                          registrar la versión en el backend
#   ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET     Authenticode con SSL.com eSigner (opcional:
#                                                                  sin ellos el instalador sale SIN firmar, canal beta)
#   APPLE_CERTIFICATE (p12 en base64), APPLE_CERTIFICATE_PASSWORD  Developer ID de CreceTec (Mac; sin ellos el job sólo
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8 (contenido)  compila y prueba, sin publicar)
#
# El Mac se publica con la etiqueta desktop-mac-vX.Y.Z (release propia) o con tools/release/desktop-mac.sh
# desde el Mac de Pablo (mismos pasos).
name: desktop-release
on:
  push:
    branches: [main]
    tags: ["desktop-v*", "desktop-mac-v*"]
    paths: ["apps/desktop/**", ".github/workflows/desktop-release.yml", "src-tauri/**", "src/**"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop-release.yml"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Crear la release y registrar la versión (beta, inactiva)"
        type: boolean
        default: false

env:
  DESKTOP_DIR: .
  API_BASE: https://api.asistentealfredo.cl/api

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.DESKTOP_DIR }}/src-tauri
            ${{ env.DESKTOP_DIR }}/macos
      - name: Llavero de prueba (test del Llavero)
        run: |
          security create-keychain -p ci ci.keychain-db
          security default-keychain -s ci.keychain-db
          security unlock-keychain -p ci ci.keychain-db
      - name: Tests de Rust en macOS (alfredo-macos y el escritorio)
        run: |
          (cd "$DESKTOP_DIR/macos" && cargo test)
          (cd "$DESKTOP_DIR/src-tauri" && cargo test --locked)
      - name: Versión
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./$DESKTOP_DIR/package.json').version")
          PUB=false
          if [[ "$GITHUB_REF" == refs/tags/desktop-mac-v* ]]; then V="${GITHUB_REF#refs/tags/desktop-mac-v}"; PUB=true; fi
          # desktop-mac.sh --publicar (desde el Mac) crea la etiqueta junto con la release y sube el
          # DMG ya notarizado: no se vuelve a compilar ni a subir otro DMG con otro hash.
          if [[ $PUB == true ]] && gh release view "${GITHUB_REF#refs/tags/}" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "_universal.dmg$"; then
            echo "La release ya tiene el DMG (publicada desde el Mac): sólo tests y build."; PUB=false
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publicar=$PUB" >> "$GITHUB_OUTPUT"
      - name: Build universal (firma Developer ID si hay secretos)
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          # Con el certificado, Tauri lo importa a un llavero temporal y firma con Developer ID.
          if [[ -n "$APPLE_CERTIFICATE" ]]; then export APPLE_SIGNING_IDENTITY="Developer ID Application: CreceTec SpA (5894Q84A9X)"; else unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; fi
          EXTRA="{\"version\":\"$V\""
          [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]] && EXTRA="$EXTRA,\"bundle\":{\"createUpdaterArtifacts\":false}"
          EXTRA="$EXTRA}"
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg --config "$EXTRA"
          lipo -archs "src-tauri/target/universal-apple-darwin/release/bundle/macos/Alfredo Caja.app/Contents/MacOS/Alfredo Caja"
      - name: Notarizar y grapar el DMG
        if: steps.ver.outputs.publicar == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [[ -z "$APPLE_API_KEY" || -z "$APPLE_CERTIFICATE" ]]; then echo "Sin secretos de Apple: no se publica el Mac desde la CI (usar tools/release/desktop-mac.sh)"; exit 1; fi
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          DMG=$(ls "$DESKTOP_DIR"/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          codesign -s "Developer ID Application: CreceTec SpA (5894Q84A9X)" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 2h
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t install "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: alfredo-caja-mac-${{ steps.ver.outputs.version }}
          path: |
            ${{ env.DESKTOP_DIR }}/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            ${{ env.DESKTOP_DIR }}/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz*
          if-no-files-found: warn
      - name: Release de GitHub y registro (beta, inactiva)
        if: steps.ver.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_PUBLISH_TOKEN: ${{ secrets.DESKTOP_PUBLISH_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          B="$DESKTOP_DIR/src-tauri/target/universal-apple-darwin/release/bundle"
          TAG="desktop-mac-v$V"
          cp "$(ls "$B"/dmg/*.dmg | head -1)" "Alfredo-Caja_${V}_universal.dmg"
          cp "$B/macos/Alfredo Caja.app.tar.gz" "Alfredo-Caja_${V}_universal.app.tar.gz"
          cp "$B/macos/Alfredo Caja.app.tar.gz.sig" "Alfredo-Caja_${V}_universal.app.tar.gz.sig"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Alfredo Caja $V (Mac, beta)" --notes "Alfredo Caja para Mac $V (beta). Firmada con Developer ID y notarizada por Apple." --target "$GITHUB_SHA"
          gh release upload "$TAG" --clobber "Alfredo-Caja_${V}_universal.dmg" "Alfredo-Caja_${V}_universal.app.tar.gz" "Alfredo-Caja_${V}_universal.app.tar.gz.sig"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          [[ -z "$DESKTOP_PUBLISH_TOKEN" ]] && { echo "Sin DESKTOP_PUBLISH_TOKEN: no se registra"; exit 0; }
          node "$( [[ -f tools/release/desktop-publicar.mjs ]] && echo tools/release/desktop-publicar.mjs || echo desktop-publicar.mjs )" \
            --version "$V" --target darwin --arch universal \
            --url "$BASE/Alfredo-Caja_${V}_universal.app.tar.gz" --file "Alfredo-Caja_${V}_universal.app.tar.gz" \
            --sig "Alfredo-Caja_${V}_universal.app.tar.gz.sig" --download-url "$BASE/Alfredo-Caja_${V}_universal.dmg" --channel beta

  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/desktop-mac-v') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DESKTOP_DIR }}/src-tauri

      - name: Versión desde la etiqueta
        id: ver
        run: |
          V=$(node -p "require('./$DESKTOP_DIR/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            V="${GITHUB_REF#refs/tags/desktop-v}"
            node -e "const f='./$DESKTOP_DIR/package.json';const p=require(f);p.version='$V';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          PUB=false
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* || "${{ inputs.publicar }}" == "true" ]]; then PUB=true; fi
          echo "publicar=$PUB" >> "$GITHUB_OUTPUT"
          echo "Alfredo Caja $V (publicar=$PUB)"

      - name: Tests de Rust (lista blanca, reloj, reintentos, DOC_INFO_1, serie, DLE EOT, subredes, deviceId, hash)
        working-directory: ${{ env.DESKTOP_DIR }}/src-tauri
        run: cargo test --locked

      - name: Firma Authenticode (si hay certificado)
        id: authenticode
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          if [[ -n "$ES_USERNAME" && -n "$ES_PASSWORD" && -n "$ES_CREDENTIAL_ID" && -n "$ES_TOTP_SECRET" ]]; then
            # CodeSignTool de SSL.com (eSigner, HSM en la nube): firma el .exe y el instalador.
            curl -sSL -o cst.zip https://www.ssl.com/download/codesigntool-for-windows/
            mkdir -p "$RUNNER_TEMP/cst" && unzip -q cst.zip -d "$RUNNER_TEMP/cst"
            CST=$(cygpath -w "$(ls -d "$RUNNER_TEMP"/cst/*/ 2>/dev/null | head -1 || echo "$RUNNER_TEMP/cst/")")
            CMD="cmd /C \"cd /d $CST && CodeSignTool.bat sign -username=$ES_USERNAME -password=$ES_PASSWORD -credential_id=$ES_CREDENTIAL_ID -totp_secret=$ES_TOTP_SECRET -override=true -input_file_path=%1\""
            node -e "require('fs').writeFileSync('sign.json', JSON.stringify({bundle:{windows:{signCommand: process.argv[1]}}}))" "$CMD"
            echo "config=--config sign.json" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin certificado de firma de código: el instalador sale SIN firma Authenticode (canal beta, aviso de SmartScreen)."
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (NSIS + firma del updater)
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ALFREDO_DESKTOP_SENTRY_DSN: ${{ secrets.ALFREDO_DESKTOP_SENTRY_DSN }}
        run: |
          EXTRA=""
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Sin TAURI_SIGNING_PRIVATE_KEY: build sin artefactos del updater (sólo verificación)."
            EXTRA='--config {"bundle":{"createUpdaterArtifacts":false}}'
          fi
          npx --yes @tauri-apps/cli@2 build --bundles nsis ${{ steps.authenticode.outputs.config }} $EXTRA

      - name: Verificar la firma Authenticode
        if: steps.authenticode.outputs.signed == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:DESKTOP_DIR/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Firma Authenticode inválida: $($sig.Status)" }
          $sig.SignerCertificate.Subject

      - name: Artefactos
        id: art
        run: |
          D="$DESKTOP_DIR/src-tauri/target/release/bundle/nsis"
          ls -la "$D"
          EXE=$(ls "$D"/*-setup.exe | head -1)
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$EXE")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$EXE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: alfredo-caja-windows-${{ steps.ver.outputs.version }}
          path: ${{ env.DESKTOP_DIR }}/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

      - name: Release de GitHub (beta)
        if: steps.ver.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.authenticode.outputs.signed }}
        run: |
          D="$DESKTOP_DIR/src-tauri/target/release/bundle/nsis"
          TAG="desktop-v$V"
          NOTA="Alfredo Caja para Windows $V (beta)."
          [[ "$SIGNED" != "true" ]] && NOTA="$NOTA Instalador sin firma de código todavía: Windows puede mostrar «Windows protegió su PC» → «Más información» → «Ejecutar de todas formas»."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Alfredo Caja $V (Windows, beta)" --notes "$NOTA" --target "$GITHUB_SHA"
          # Nombre sin espacios para la URL de descarga.
          cp "${{ steps.art.outputs.exe }}" "Alfredo-Caja_${V}_x64-setup.exe"
          cp "${{ steps.art.outputs.exe }}.sig" "Alfredo-Caja_${V}_x64-setup.exe.sig"
          gh release upload "$TAG" "Alfredo-Caja_${V}_x64-setup.exe" "Alfredo-Caja_${V}_x64-setup.exe.sig" --clobber

      - name: Registrar la versión (inactiva) en el backend
        if: steps.ver.outputs.publicar == 'true'
        env:
          DESKTOP_PUBLISH_TOKEN: ${{ secrets.DESKTOP_PUBLISH_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.authenticode.outputs.signed }}
        run: |
          if [[ -z "$DESKTOP_PUBLISH_TOKEN" ]]; then echo "Sin DESKTOP_PUBLISH_TOKEN: no se registra"; exit 0; fi
          node "$( [[ -f tools/release/desktop-publicar.mjs ]] && echo tools/release/desktop-publicar.mjs || echo desktop-publicar.mjs )" \
            --version "$V" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-v$V/Alfredo-Caja_${V}_x64-setup.exe" \
            --file "Alfredo-Caja_${V}_x64-setup.exe" \
            --sig "Alfredo-Caja_${V}_x64-setup.exe.sig" \
            --channel beta \
            --authenticode "$SIGNED"
