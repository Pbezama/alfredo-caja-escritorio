[package]
name = "alfredo-caja"
version = "0.1.0"
description = "Alfredo Caja de escritorio"
authors = ["CreceTec SpA"]
edition = "2021"

[lib]
name = "alfredo_caja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "rt", "macros"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
httpdate = "1"
url = "2"
machine-uid = "0.5"
sysinfo = "0.37"
serialport = { version = "4", default-features = false }
mdns-sd = "0.13"
if-addrs = "0.13"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sentry = { version = "0.38", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

# Todas las versiones de `zip` en crates.io menos la 9.x están retiradas (yanked) a oct-2026 y
# tauri-plugin-updater 2.14 pide ^4 (sólo en Windows). Se fija la 4.6.1 desde su etiqueta.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2.git", tag = "v4.6.1" }
